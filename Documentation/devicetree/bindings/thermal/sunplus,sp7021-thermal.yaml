%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/sunplus,sp7021-thermal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sunplus SP7021 SoC thermal sensor

maintainers:
  - Andrew Gaylard <andrew@figment.co.za>

description:
  The SP7021 contains an on-chip thermal sensor that measures die
  temperature. A factory-programmed calibration value stored in OTP
  is used to correct the raw ADC reading.

allOf:
  - $ref: thermal-sensor.yaml#

properties:
  compatible:
    const: sunplus,sp7021-thermal

  reg:
    maxItems: 1

  '#thermal-sensor-cells':
    const: 0

  nvmem-cells:
    maxItems: 1

  nvmem-cell-names:
    items:
      - const: therm_calib

required:
  - compatible
  - reg
  - '#thermal-sensor-cells'

unevaluatedProperties: false

examples:
  - |
    thermal: thermal@280 {
        compatible = "sunplus,sp7021-thermal";
        reg = <0x280 0x80>;
        '#thermal-sensor-cells' = <0>;
        nvmem-cell-names = "therm_calib";
        nvmem-cells = <&therm_calib>;
    };
